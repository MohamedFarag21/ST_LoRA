# EoMT environment (`eomt`) — required ONLY for the EoMT experiments, which need the
# newer transformers that ships EomtForUniversalSegmentation.
# Recreate with:  conda env create -f environment_eomt.yml  &&  conda activate st_lora_eomt
#
# On the HPC cluster:
#   module purge; module load CUDA/12.6.0 Miniforge3; source activate eomt
#
# Identical to the main env EXCEPT transformers (5.14.1 vs 4.52.2). Use this env for any
# eomt_*.py script; use the main env (environment.yml) for Mask2Former + SegFormer.
name: st_lora_eomt
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11.5
  - pip
  - pip:
      - torch==2.7.0
      - torchvision==0.22.0
      - pytorch-lightning==2.5.1.post0
      - lightning==2.5.1.post0
      - transformers==5.14.1     # <-- the one difference vs the main env
      - peft==0.15.2
      - accelerate==1.7.0
      - huggingface-hub==0.31.4
      - safetensors==0.5.3
      - evaluate==0.4.3
      - torchmetrics==1.7.1
      - torch_uncertainty==0.5.0
      - numpy==2.2.6
      - scipy==1.15.3
      - scikit-learn==1.6.1
      - scikit-image==0.25.2
      - pillow==11.2.1
      - matplotlib==3.10.3
      - tqdm==4.67.1
      - PyYAML==6.0.2
